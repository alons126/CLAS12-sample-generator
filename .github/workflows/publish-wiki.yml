name: Publish documentation wiki

on:
  push:
    branches:
      - dev
      - main
    paths:
      - README.md
      - config/run.json.md
      - config/samples/README.md
      - docs/**
      - tutorials/**
      - dev-tools/wiki/build_wiki.py
      - .github/workflows/publish-wiki.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-documentation-wiki
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish wiki
    runs-on: ubuntu-latest

    steps:
      - name: Check out maintained documentation
        uses: actions/checkout@v4

      - name: Build wiki pages
        run: >-
          python3 dev-tools/wiki/build_wiki.py
          --output "${RUNNER_TEMP}/generated-wiki"
          --repository "${GITHUB_REPOSITORY}"
          --branch "${GITHUB_REF_NAME}"

      - name: Check out wiki repository
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
        run: |
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "${RUNNER_TEMP}/wiki"

      - name: Synchronize generated pages
        run: >-
          rsync --archive --delete --exclude .git/
          "${RUNNER_TEMP}/generated-wiki/"
          "${RUNNER_TEMP}/wiki/"

      - name: Publish changed pages
        working-directory: ${{ runner.temp }}/wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki is already current."
            exit 0
          fi
          git commit -m "Publish documentation from ${GITHUB_SHA}"
          git push origin HEAD
