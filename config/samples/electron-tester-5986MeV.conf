# electron-tester-5986MeV.conf -----------------------------------------------------------------
# Description:
#   Legacy-derived trigger-electron angular tester for Ar40 metadata at 5.98636 GeV.
# Purpose:
#   Scan 5--40 degrees and full phi at beam momentum to estimate the trigger-electron placement used by electron-hadron samples.
# Workflow:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/electron-tester-5986MeV.conf --output OUTPUT_PARENT
# Units:
#   Beam energy and particle momenta are GeV and GeV/c; angles are degrees; vertices are cm.
# Notes:
#   This profile is complete except for output. A command-line --key value overrides the matching value below.

channel = 1e
beam-energy = 5.98636
rgm-target = Ar40
vertex-mode = fixed
vertex-x = 0
vertex-y = 0
vertex-z = -3
events = 1000000
events-per-file = 25000
seed = 67890
vertex-seed = 12345
prefix = Electron_tester_5986MeV
electron-theta-min = 5
electron-theta-max = 40
electron-momentum = beam
electron-p-min = 0.7
electron-p-max = 5.98636
lund-format = legacy
mass-convention = standard
render-plots = true
