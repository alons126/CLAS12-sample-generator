# legacy-coderun.conf ----------------------------------------------------------
# Description: Explicit settings corresponding to the pinned upstream uniform CodeRun.cpp defaults.
# Purpose: Reproduce its active 2.07052 GeV 1e call, including 1-foil-small geometry and A=1/Z=1.
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/legacy-coderun.conf --output OUTPUT_PARENT
# Main options: channel, beam-energy, rgm-target, target, A, Z, events, events-per-file, prefix, seed, vertex-seed,
# lund-format and mass-convention. Override the very large event count for smoke tests. CodeRun.cpp
# also actively calls legacy ep and en; select them with `channel = eh`, `hadron = proton|neutron`,
# `hadron-region = FD`, and an explicit matching prefix. Their compatibility settings are below. The upstream TRandom3(0) production state is unknown,
# so this profile uses an explicit reproducible seed rather than claiming event replay.
# This is a compatibility profile, not a physically consistent nuclear-metadata profile.

channel = 1e
beam-energy = 2.07052
rgm-target = C12-small
target = 1-foil-small
A = 1
Z = 1
events = 50000000
events-per-file = 10000
prefix = Uniform_1e_sample_2070MeV
seed = 67890
vertex-seed = 12345
electron-momentum = uniform
electron-p-min = 0
electron-p-max = auto
hadron-momentum = uniform
hadron-angle = theta
hadron-p-min = 0.3
hadron-p-max = auto
lund-format = legacy
mass-convention = legacy
