# legacy-coderun.conf ----------------------------------------------------------
# Description: Explicit settings corresponding to the active archived uniform CodeRun.cpp call.
# Purpose: Reproduce and test the old 1e LUND contract, including its historical A=1/Z=1 header.
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/legacy-coderun.conf --output OUTPUT_PARENT
# Main options: channel, beam-energy, target, A, Z, events, prefix, seed, vertex-seed,
# lund-format and mass-convention. Override the very large event count for smoke tests.
# This is a compatibility profile, not the recommended physically consistent Ar40 production profile.

channel = 1e
beam-energy = 2.07052
target = Ar
A = 1
Z = 1
events = 100000000
prefix = Uniform_1e_sample_2070MeV
seed = 67890
vertex-seed = 12345
lund-format = legacy
mass-convention = legacy
