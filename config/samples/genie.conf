# genie.conf ------------------------------------------------------------------
# Description: Production-sized GENIE GST-to-LUND example for an Ar40 target at 5.98636 GeV.
# Purpose: Provide reviewed physical-sample metadata while leaving dataset paths explicit at runtime.
# Usage:
#   source run.csh --workflow create-lund --source physical \
#     --config config/samples/genie.conf --input 'GST_GLOB' --output OUTPUT_PARENT
# Main options: event-generator, event-generator-version, tune, q2-cut, gemc-version,
# beam-energy, rgm-target, events, events-per-file, vertex-seed, prefix and render-plots.
# Required runtime options: input and output. Any profile key may be overridden with `--key value`.
# GENIE is the default and currently implemented physical adapter; use `... -- --help` for all options.

event-generator = genie
event-generator-version = unknown
tune = unknown
q2-cut = Q2_0_40
gemc-version = 5.14
beam-energy = 5.98636
rgm-target = Ar40
events = 10000000
events-per-file = 10000
vertex-seed = 12345
prefix = GENIE_Ar40_5986MeV
