# uniform-epipFD-2070MeV.conf -----------------------------------------------------------------
# Description:
#   Experimental uniform epipFD acceptance sample for Ar40 at 2.07052 GeV.
# Purpose:
#   Apply the maintained FD positive-pion prescription with the established artificial trigger electron.
# Workflow:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-epipFD-2070MeV.conf --output OUTPUT_PARENT
# Units:
#   Beam energy and particle momenta are GeV and GeV/c; angles are degrees; vertices are cm.
# Validation:
#   This mode has structural integration coverage but has not yet been tested as a production sample.
# Notes:
#   This profile is complete except for output. A command-line --key value overrides the matching value below.

channel = eh
hadron = pip
hadron-region = FD
beam-energy = 2.07052
rgm-target = Ar40
target = Ar
A = 40
Z = 18
gemc-target-variation = rgm_fall2021_Ar
vertex-mode = target
events = 50000000
events-per-file = 25000
seed = 67890
vertex-seed = 12345
lund-format = legacy
mass-convention = standard
render-plots = true
prefix = Uniform_sample_epipFD_2070MeV
electron-momentum = beam
hadron-theta-min = 5
hadron-theta-max = 45
hadron-momentum = mixed
hadron-angle = theta
hadron-p = 1
hadron-p-min = 0.2
hadron-p-max = 2.07052
trigger-theta = 25
trigger-phi-offset = 16
