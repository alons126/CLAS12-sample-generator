# electron-tester.conf ---------------------------------------------------------
# Description: Legacy-compatible angular electron tester with beam momentum and a fixed Hall B vertex.
# Purpose: Scan theta 5–40 degrees and all phi at beam momentum to roughly estimate where the epFD/enFD and related electron–hadron trigger electron should be thrown; the production 25-degree choice came from this scan.
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/electron-tester.conf --output OUTPUT_PARENT
# Main options: channel, beam-energy, rgm-target, vertex-mode, vertex-x/y/z,
# electron-momentum, electron-theta-min/max, events, seed, vertex-seed and prefix.
# Any key may be replaced after --config with `--key value`; run `... -- --help` for all options.

channel = 1e
beam-energy = 5.98636
rgm-target = Ar40
vertex-mode = fixed
vertex-x = 0
vertex-y = 0
vertex-z = -3
electron-momentum = beam
events = 1000
events-per-file = 25000
prefix = Electron_tester
