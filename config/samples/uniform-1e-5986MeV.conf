# uniform-1e-5986MeV.conf -----------------------------------------------------------------
# Description:
#   Production uniform 1e acceptance sample for Ar40 at 5.98636 GeV.
# Purpose:
#   Retain the legacy flat angular coverage while applying the updated 0.7 GeV/c threshold and balanced p/1-p momentum sampling.
# Workflow:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-1e-5986MeV.conf --output OUTPUT_PARENT
# Units:
#   Beam energy and particle momenta are GeV and GeV/c; angles are degrees; vertices are cm.
# Notes:
#   This profile is complete except for output. A command-line --key value overrides the matching value below.

channel = 1e
beam-energy = 5.98636
rgm-target = Ar40
vertex-mode = target
events = 50000000
events-per-file = 25000
seed = 67890
vertex-seed = 12345
lund-format = legacy
mass-convention = standard
render-plots = true
prefix = Uniform_sample_1e_5986MeV
electron-theta-min = 5
electron-theta-max = 40
electron-momentum = mixed
electron-p-min = 0.7
electron-p-max = 5.98636
