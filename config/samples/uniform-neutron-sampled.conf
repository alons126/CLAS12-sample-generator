# uniform-neutron-sampled.conf ------------------------------------------------
# Description: Explicit non-fixed enFD profile equivalent to the production neutron prescription.
# Purpose: Cover neutron momentum from zero while retaining the legacy flat 5--35 degree theta range.
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-neutron-sampled.conf --output OUTPUT_PARENT
# Main options: channel, beam-energy, rgm-target, events, events-per-file, seed, vertex-seed, prefix,
# hadron-momentum, hadron-angle, hadron-theta-min/max, hadron-p-min/max and trigger settings.
# `sampled` resolves to uniform momentum for en; angles remain uniform in theta.

channel = eh
hadron = neutron
hadron-region = FD
beam-energy = 5.98636
rgm-target = Ar40
events = 10000
prefix = Uniform_sample_enFD_5986MeV
hadron-momentum = sampled
hadron-angle = theta
hadron-p-min = 0
hadron-p-max = auto
lund-format = legacy
