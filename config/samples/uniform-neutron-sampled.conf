# uniform-neutron-sampled.conf ------------------------------------------------
# Description: Non-fixed en acceptance sample with sampled neutron momentum and isotropic direction.
# Purpose: Cover neutron phase space inside the legacy 5--35 degree angular acceptance.
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-neutron-sampled.conf --output OUTPUT_PARENT
# Main options: channel, beam-energy, rgm-target, events, events-per-file, seed, vertex-seed, prefix,
# nucleon-momentum, nucleon-angle, nucleon-theta-min/max, nucleon-p-min/max and trigger settings.
# `sampled` resolves to uniform momentum for en; `auto` angle resolves to isotropic in cos(theta).

channel = en
beam-energy = 5.98636
rgm-target = Ar40
events = 10000
prefix = Uniform_sample_en_5986MeV
nucleon-momentum = sampled
nucleon-angle = auto
nucleon-p-min = 0.3
nucleon-p-max = auto
lund-format = legacy
