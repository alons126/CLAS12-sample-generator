# uniform-encd-4029.conf -----------------------------------------------------------------
# Description:
#   Experimental uniform enCD acceptance sample for Ar40 at 4.02962 GeV.
# Purpose:
#   Apply the maintained CD neutron prescription with the established artificial trigger electron.
# Workflow:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-encd-4029.conf --output OUTPUT_PARENT
# Units:
#   Beam energy and particle momenta are GeV and GeV/c; angles are degrees; vertices are cm.
# Validation:
#   This mode has structural integration coverage but has not yet been tested as a production sample.
# Notes:
#   This profile is complete except for output. A command-line --key value overrides the matching value below.

channel = eh
hadron = neutron
hadron-region = CD
beam-energy = 4.02962
rgm-target = Ar40
target = Ar
A = 40
Z = 18
gemc-target-variation = rgm_fall2021_Ar
vertex-mode = target
events = 50000000
events-per-file = 25000
seed = 67890
vertex-seed = 12345
lund-format = legacy
mass-convention = standard
render-plots = true
prefix = Uniform_sample_enCD_4029MeV
electron-momentum = beam
hadron-theta-min = 35
hadron-theta-max = 145
hadron-momentum = uniform
hadron-angle = theta
hadron-p = 1
hadron-p-min = 0
hadron-p-max = 4.02962
trigger-theta = 25
trigger-phi-offset = 7
