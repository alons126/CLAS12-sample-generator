# uniform-proton-sampled.conf -------------------------------------------------
# Description: Non-fixed epFD acceptance sample with the requested two-component proton momentum model.
# Purpose: Generate a 50/50 mixture uniform in p and uniform in 1/p over shared positive bounds.
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-proton-sampled.conf --output OUTPUT_PARENT
# Main options: channel, beam-energy, rgm-target, events, events-per-file, seed, vertex-seed, prefix,
# hadron-momentum, hadron-angle, hadron-theta-min/max, hadron-p-min/max and trigger settings.
# `sampled` resolves to `mixed` for ep; proton angles retain the legacy flat-theta prescription.

channel = eh
hadron = proton
hadron-region = FD
beam-energy = 5.98636
rgm-target = Ar40
events = 10000
prefix = Uniform_sample_epFD_5986MeV
hadron-momentum = sampled
hadron-angle = theta
hadron-p-min = 0.3
hadron-p-max = auto
lund-format = legacy
