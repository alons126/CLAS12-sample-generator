# uniform-proton-sampled.conf -------------------------------------------------
# Description: Non-fixed ep acceptance sample with the requested two-component proton momentum model.
# Purpose: Generate a 50/50 mixture uniform in p and uniform in 1/p over shared positive bounds.
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-proton-sampled.conf --output OUTPUT_PARENT
# Main options: channel, beam-energy, rgm-target, events, seed, vertex-seed, prefix,
# nucleon-momentum, nucleon-angle, nucleon-theta-min/max, nucleon-p-min/max and trigger settings.
# `sampled` resolves to `mixed` for ep; proton angles retain the legacy flat-theta prescription.

channel = ep
beam-energy = 5.98636
rgm-target = Ar40
events = 10000
prefix = Uniform_sample_ep_5986MeV
nucleon-momentum = sampled
nucleon-angle = auto
nucleon-p-min = 0.3
nucleon-p-max = auto
lund-format = legacy
