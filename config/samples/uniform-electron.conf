# uniform-electron.conf --------------------------------------------------------
# Description: Production uniform single-electron acceptance sample for Ar40 at 5.98636 GeV.
# Purpose: Populate electron acceptance maps with flat angles and balanced p/1-p momentum coverage.
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-electron.conf --output OUTPUT_PARENT
# Main options: channel, beam-energy, rgm-target, events, events-per-file, seed, vertex-seed, prefix,
# electron-theta-min/max, electron-momentum, electron-p-min/max, lund-format, mass-convention and render-plots.
# Units: momenta in GeV/c, beam energy in GeV, angles in degrees, vertices in cm. CLI `--key value` wins.

channel = 1e
beam-energy = 5.98636
rgm-target = Ar40
events = 100000
events-per-file = 25000
seed = 67890
vertex-seed = 12345
prefix = Uniform_sample_1e_5986MeV
electron-theta-min = 5
electron-theta-max = 40
electron-momentum = mixed
electron-p-min = 0.7
electron-p-max = auto
