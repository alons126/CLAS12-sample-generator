# legacy-genie-wrapper.conf ----------------------------------------------------
# Description: Explicit metadata corresponding to the archived GENIE_to_LUND_converter.csh wrapper.
#
# Purpose: Reproduce the former C12/2.07052 GeV conversion without parsing metadata from filenames.
# 
# Usage:
#   source run.csh --workflow create-lund --source physical \
#     --config config/samples/physical-lund-creation/legacy-genie-wrapper.conf --input 'GST_GLOB' --output OUTPUT_PARENT
# 
# Main options:
#   event-generator/version, tune, q2-cut, beam-energy, target, events,
#   events-per-file, prefix, and vertex-seed.
#   Required runtime options: input and output. Override the production event limit for smoke tests.

# Archived dataset provenance -------------------------------------------------
# These values reproduce metadata selected by the legacy GENIE conversion wrapper; they do not generate or filter the input sample.

beam-energy = 2.07052
event-generator = genie-gst
event-generator-version = unknown
tune = GEM21_11a_00_000
q2-cut = Q2_0_02

# Target defaults -------------------------------------------------------------
# C12 at 2.07052 GeV resolves A=12/Z=6, the rgm_fall2021_C_S GEMC variation, and its 1-foil-small vertex geometry.

target = C12

# Conversion capacity and naming ----------------------------------------------
# The event limit matches the archived production scale; accepted records split at 10000 events per LUND file.
# Automatic naming keeps the archived target/tune/cut/beam values while applying the maintained
# double-underscore separator contract.

events = 50000000

# Split accepted output at 10000 and stop after the first accepted event in an input tail shorter than this block.
events-per-file = 10000
prefix = auto

# Vertex and byte-parity conventions ------------------------------------------
# The vertex seed reproduces the deterministic geometry stream used for comparison.
# Legacy formatting and archived masses are selected for converter parity rather than current production precision.

vertex-seed = 12345
