# genie-gst.conf --------------------------------------------------------------
# Description:
#   Production-sized GENIE GST-to-LUND example for an Ar40 target at 5.98636 GeV.
#
# Purpose:
#   Provide reviewed physical-sample metadata while leaving dataset paths explicit at runtime.
# 
# Usage:
#   source run.csh --workflow create-lund --source physical \
#     --config config/samples/physical-lund-creation/genie-gst.conf --input 'GST_GLOB' --output OUTPUT_PARENT
# 
# Main options:
#   event-generator, event-generator-version, tune, q2-cut, beam-energy, target,
#   optional gemc-target-variation, events, events-per-file, vertex-seed and prefix.
#   Required runtime options: input and output. Any profile key may be overridden with `--key value`.
#   GENIE GST is the default and currently implemented physical adapter; use `... -- --help` for all options.

# Physical input adapter and provenance ---------------------------------------
# `event-generator` selects the converter adapter. Version, tune, and Q2 label describe existing input truth and output provenance.
# This program converts GST content; it does not run GENIE or apply the stated Q2 cut itself.

event-generator = genie-gst
event-generator-version = unknown
tune = unknown
q2-cut = Q2_0_40

# Beam and target defaults ----------------------------------------------------
# Beam energy plus `target` resolves the GEMC variation and matching vertex geometry. Ar40 resolves
# rgm_fall2021_Ar, Ar geometry, A=40, and Z=18 at every supported beam energy.

beam-energy = 5.98636
target = Ar40

# Conversion capacity and splitting -------------------------------------------
# `events` limits accepted output events; rejected GST entries do not consume this capacity.
# `events-per-file` controls accepted records per file and the remaining-input cutoff block aligned with submission JOB_NEVENTS. `vertex-seed` drives one shared vertex per retained event.

events = 10000000
events-per-file = 10000
vertex-seed = 12345

# LUND filename ---------------------------------------------------------------
# The prefix names LUND files. The run directory separately records target variation, generator, tune, Q2, and beam provenance.

prefix = GENIE_Ar40_5986MeV
