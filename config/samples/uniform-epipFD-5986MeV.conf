# uniform-epipFD-5986MeV.conf -----------------------------------------------------------------
# Description:
#   Experimental uniform epipFD acceptance sample for Ar40 at 5.98636 GeV.
# Purpose:
#   Apply the maintained FD positive-pion prescription with the established artificial trigger electron.
# Workflow:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-epipFD-5986MeV.conf --output OUTPUT_PARENT
# Units:
#   Beam energy and particle momenta are GeV and GeV/c; angles are degrees; vertices are cm.
# Validation:
#   This mode has structural integration coverage but has not yet been tested as a production sample.
# Notes:
#   This profile is complete except for output. A command-line --key value overrides the matching value below.

# Sample identity -------------------------------------------------------------
# `channel` selects one electron or an electron--hadron event; hadron fields identify the second particle and detector region.
# `beam-energy` sets the LUND beam field and the upper momentum scale for this beam-specific profile.

channel = eh
hadron = pip
hadron-region = FD
beam-energy = 5.98636

# Target and vertex defaults --------------------------------------------------
# `rgm-target` resolves target geometry, A/Z metadata, and the default GEMC variation from the maintained catalog.
# `vertex-mode = target` samples one catalog-selected interaction vertex and shares it between all particles in the event.

rgm-target = Ar40
vertex-mode = target

# Run size and reproducibility ------------------------------------------------
# `events` is the total generated event count; `events-per-file` is the LUND split threshold.
# Kinematic and vertex seeds own separate ROOT random streams. Nonzero values make their sequences repeatable.

events = 50000000
events-per-file = 25000
seed = 67890
vertex-seed = 12345

# Output contract -------------------------------------------------------------
# `prefix` names LUND files. Legacy formatting retains established text layout; standard masses come from support/constants.h.
# `render-plots` writes the configured legacy-compatible PDF/PNG diagnostics in addition to ROOT monitoring.

prefix = Uniform_sample_epipFD_5986MeV
lund-format = legacy
mass-convention = standard
render-plots = true

# Hadron kinematics -----------------------------------------------------------
# Theta is flat inside the selected FD/CD range and phi covers the full azimuth.
# `mixed` means a 50/50 uniform-p/uniform-1/p mixture; `uniform` means a flat momentum draw.
# `hadron-p` is retained as the neutron-only fixed-mode value and is ignored by uniform or mixed modes.

hadron-theta-min = 5
hadron-theta-max = 45
hadron-momentum = mixed
hadron-angle = theta
hadron-p = 1
hadron-p-min = 0.2
hadron-p-max = 5.98636

# Trigger electron ------------------------------------------------------------
# The trigger electron has beam momentum and fixed theta. Its phi uses the sector closest to opposite the hadron plus the offset.
# The opposite-sector construction is retained for CD separation even though CD geometry does not require it.

electron-momentum = beam
trigger-theta = 25
trigger-phi-offset = 5
