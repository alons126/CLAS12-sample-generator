# uniform-epFD-2070MeV.conf -----------------------------------------------------------------
# Description:
#   Production uniform epFD acceptance sample for Ar40 at 2.07052 GeV.
#
# Purpose:
#   Retain the legacy FD angles and artificial trigger electron while applying the updated 50/50 uniform-p/uniform-1/p proton prescription.
#
# Workflow:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-epFD-2070MeV.conf --output OUTPUT_PARENT
#
# Units:
#   Beam energy and particle momenta are GeV and GeV/c; angles are degrees; vertices are cm.
#
# Notes:
#   This profile is complete except for output. A command-line --key value overrides the matching value below.

# Sample identity -------------------------------------------------------------
# `channel` selects one electron or an electron--hadron event; hadron fields identify the second particle and detector region.
# `beam-energy` sets the LUND beam field and the upper momentum scale for this beam-specific profile.

channel = eh
hadron = proton
hadron-region = FD
beam-energy = 2.07052

# Target geometry and metadata ------------------------------------------------
# `rgm-target` resolves target geometry, A/Z metadata, and the default GEMC variation from the maintained catalog.
# Every event samples one vertex from that geometry and shares it between all particles in the event.

rgm-target = Ar40

# Run size and reproducibility ------------------------------------------------
# `events` is the total generated event count; `events-per-file` is the LUND split threshold.
# Kinematic and target-vertex seeds own separate ROOT random streams. Nonzero values make their sequences repeatable.

events = 50000000
events-per-file = 25000
seed = 67890
vertex-seed = 12345

# Output contract -------------------------------------------------------------
# LUND filenames are derived automatically from channel and beam energy. `--prefix` remains an explicit CLI override.
# The writer always uses the project LUND text layout and external targets.h masses, and every uniform run writes ROOT/PDF/PNG monitoring artifacts.

# Hadron kinematics -----------------------------------------------------------
# Theta and phi are always flat inside the selected FD/CD range and full azimuth.
# `mixed` means a 50/50 uniform-p/uniform-1/p mixture; `uniform` means a flat momentum draw. The upper bound is always the beam energy.
# `hadron-p` is retained as the neutron-only fixed-mode value and is ignored by uniform or mixed modes.

hadron-theta-min = 5
hadron-theta-max = 45
hadron-momentum = mixed
hadron-p-min = 0.3

# Trigger electron ------------------------------------------------------------
# The trigger electron automatically has beam momentum and fixed theta. Its phi uses the sector closest to opposite the hadron plus the offset.
# The opposite-sector construction is retained for CD separation even though CD geometry does not require it.

trigger-theta = 25
trigger-phi-offset = 16
