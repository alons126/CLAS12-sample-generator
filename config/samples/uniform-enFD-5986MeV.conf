# uniform-enFD-5986MeV.conf -----------------------------------------------------------------
# Description:
#   Production uniform enFD acceptance sample for Ar40 at 5.98636 GeV.
# Purpose:
#   Retain the legacy FD angles and artificial trigger electron while applying the updated zero-to-beam uniform neutron momentum prescription.
# Workflow:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-enFD-5986MeV.conf --output OUTPUT_PARENT
# Units:
#   Beam energy and particle momenta are GeV and GeV/c; angles are degrees; vertices are cm.
# Notes:
#   This profile is complete except for output. A command-line --key value overrides the matching value below.

channel = eh
hadron = neutron
hadron-region = FD
beam-energy = 5.98636
rgm-target = Ar40
vertex-mode = target
events = 50000000
events-per-file = 25000
seed = 67890
vertex-seed = 12345
lund-format = legacy
mass-convention = standard
render-plots = true
prefix = Uniform_sample_enFD_5986MeV
electron-momentum = beam
hadron-theta-min = 5
hadron-theta-max = 35
hadron-momentum = uniform
hadron-angle = theta
hadron-p = 1
hadron-p-min = 0
hadron-p-max = 5.98636
trigger-theta = 25
trigger-phi-offset = 5
