# electron-tester-2070MeV.conf -----------------------------------------------------------------
# Description:
#   Legacy-derived trigger-electron angular tester for Ar40 metadata at 2.07052 GeV.
# Purpose:
#   Scan 5--40 degrees and full phi at beam momentum to estimate the trigger-electron placement used by electron-hadron samples.
# Workflow:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/electron-tester-2070MeV.conf --output OUTPUT_PARENT
# Units:
#   Beam energy and particle momenta are GeV and GeV/c; angles are degrees; vertices are cm.
# Notes:
#   This profile is complete except for output. A command-line --key value overrides the matching value below.

# Sample identity -------------------------------------------------------------
# The tester writes one electron at the selected beam energy; it is an angular scan rather than an interaction model.

channel = 1e
beam-energy = 2.07052

# Target metadata and fixed vertex --------------------------------------------
# `rgm-target` resolves A/Z and GEMC-variation metadata, while fixed mode deliberately bypasses target-volume sampling.
# The point (0,0,-3 cm) is the legacy Hall-B tester vertex used to choose the 25-degree trigger prescription.

rgm-target = Ar40
vertex-mode = fixed
vertex-x = 0
vertex-y = 0
vertex-z = -3

# Run size and reproducibility ------------------------------------------------
# `events` is the total tester count and `events-per-file` controls splitting.
# `seed` drives electron angles; the vertex seed is recorded consistently although a fixed vertex consumes no random draws.

events = 1000000
events-per-file = 25000
seed = 67890
vertex-seed = 12345

# Output contract -------------------------------------------------------------
# The prefix identifies tester LUND files. Legacy text format, current PDG masses, and rendered diagnostics are selected explicitly.

prefix = Electron_tester_2070MeV
lund-format = legacy
mass-convention = standard
render-plots = true

# Tester electron kinematics --------------------------------------------------
# Beam mode fixes electron momentum at the beam value while theta scans 5--40 degrees and phi covers the full azimuth.
# The stored momentum limits document the supported range but beam mode uses the configured beam energy directly.

electron-theta-min = 5
electron-theta-max = 40
electron-momentum = beam
electron-p-min = 0.7
electron-p-max = 2.07052
