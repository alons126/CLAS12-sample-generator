# uniform-epipCD-5986MeV.conf -----------------------------------------------------------------
# Description:
#   Experimental uniform epipCD acceptance sample for Ar40 at 5.98636 GeV.
# Purpose:
#   Apply the maintained CD positive-pion prescription with the established artificial trigger electron.
# Workflow:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-epipCD-5986MeV.conf --output OUTPUT_PARENT
# Units:
#   Beam energy and particle momenta are GeV and GeV/c; angles are degrees; vertices are cm.
# Validation:
#   This mode has structural integration coverage but has not yet been tested as a production sample.
# Notes:
#   This profile is complete except for output. A command-line --key value overrides the matching value below.

channel = eh
hadron = pip
hadron-region = CD
beam-energy = 5.98636
rgm-target = Ar40
target = Ar
A = 40
Z = 18
gemc-target-variation = rgm_fall2021_Ar
vertex-mode = target
events = 50000000
events-per-file = 25000
seed = 67890
vertex-seed = 12345
lund-format = legacy
mass-convention = standard
render-plots = true
prefix = Uniform_sample_epipCD_5986MeV
electron-momentum = beam
hadron-theta-min = 35
hadron-theta-max = 140
hadron-momentum = mixed
hadron-angle = theta
hadron-p = 1
hadron-p-min = 0.1
hadron-p-max = 5.98636
trigger-theta = 25
trigger-phi-offset = 5
