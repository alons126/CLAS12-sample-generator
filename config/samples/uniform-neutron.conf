# uniform-neutron.conf --------------------------------------------------------
# Description: Production enFD acceptance sample for Ar40 at 5.98636 GeV.
# Purpose: Generate the artificial trigger electron plus a flat-theta, uniform-momentum neutron.
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-neutron.conf --output OUTPUT_PARENT
# Main options: channel, beam-energy, rgm-target, events, events-per-file, seed, vertex-seed, prefix,
# hadron-theta-min/max, hadron-momentum, hadron-p, trigger-theta and trigger-phi-offset.
# Use `--hadron-momentum fixed --hadron-p 1` only for the optional fixed-neutron study.

channel = eh
hadron = neutron
hadron-region = FD
beam-energy = 5.98636
rgm-target = Ar40
events = 1000
seed = 67890
vertex-seed = 12345
prefix = Uniform_sample_enFD_5986MeV
hadron-theta-min = 5
hadron-theta-max = 35
hadron-momentum = uniform
hadron-angle = theta
hadron-p-min = 0
hadron-p-max = auto
trigger-theta = 25
trigger-phi-offset = 5
