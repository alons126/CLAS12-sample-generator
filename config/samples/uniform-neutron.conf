# uniform-neutron.conf --------------------------------------------------------
# Description: Legacy fixed-momentum en acceptance sample for Ar40 at 5.98636 GeV.
# Purpose: Reproduce the artificial trigger-electron plus 1 GeV/c neutron prescription.
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-neutron.conf --output OUTPUT_PARENT
# Main options: channel, beam-energy, rgm-target, events, seed, vertex-seed, prefix,
# nucleon-theta-min/max, nucleon-momentum, nucleon-p, trigger-theta and trigger-phi-offset.
# Set `--nucleon-momentum sampled` for the non-fixed prescription; explicit CLI values override this file.

channel = en
beam-energy = 5.98636
rgm-target = Ar40
events = 1000
seed = 67890
vertex-seed = 12345
prefix = Uniform_sample_en_5986MeV
nucleon-theta-min = 5
nucleon-theta-max = 35
nucleon-momentum = fixed
nucleon-p = 1
trigger-theta = 25
trigger-phi-offset = 5
