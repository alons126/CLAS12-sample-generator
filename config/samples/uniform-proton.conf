# uniform-proton.conf ---------------------------------------------------------
# Description: Legacy fixed-momentum ep acceptance sample for Ar40 at 5.98636 GeV.
# Purpose: Reproduce the artificial trigger-electron plus 1 GeV/c proton prescription.
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-proton.conf --output OUTPUT_PARENT
# Main options: channel, beam-energy, rgm-target, events, events-per-file, seed, vertex-seed, prefix,
# nucleon-theta-min/max, nucleon-momentum, nucleon-p, trigger-theta and trigger-phi-offset.
# Set `--nucleon-momentum sampled` for the mixed p and 1/p prescription; CLI values override this file.

channel = ep
beam-energy = 5.98636
rgm-target = Ar40
events = 1000
seed = 67890
vertex-seed = 12345
prefix = Uniform_sample_ep_5986MeV
nucleon-theta-min = 5
nucleon-theta-max = 45
# Preserve the imported code's fixed 1 GeV/c nucleon mode.
nucleon-momentum = fixed
nucleon-p = 1
trigger-theta = 25
trigger-phi-offset = 5
