# uniform-proton.conf ---------------------------------------------------------
# Description: Production epFD acceptance sample for Ar40 at 5.98636 GeV.
# Purpose: Generate the artificial trigger electron plus a 50/50 uniform-p/uniform-1/p proton.
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-proton.conf --output OUTPUT_PARENT
# Main options: channel, beam-energy, rgm-target, events, events-per-file, seed, vertex-seed, prefix,
# hadron-theta-min/max, hadron-momentum, hadron-p, trigger-theta and trigger-phi-offset.
# Proton momentum starts at 0.3 GeV/c to cover resolution below the 0.4 GeV/c FD threshold.

channel = eh
hadron = proton
hadron-region = FD
beam-energy = 5.98636
rgm-target = Ar40
events = 1000
seed = 67890
vertex-seed = 12345
prefix = Uniform_sample_epFD_5986MeV
hadron-theta-min = 5
hadron-theta-max = 45
hadron-momentum = mixed
hadron-angle = theta
hadron-p-min = 0.3
hadron-p-max = auto
trigger-theta = 25
trigger-phi-offset = 5
