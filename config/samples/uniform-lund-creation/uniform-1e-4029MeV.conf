# uniform-1e-4029MeV.conf -----------------------------------------------------------------
# Description:
#   Production uniform 1e acceptance sample for Ar40 at 4.02962 GeV.
#
# Purpose:
#   Sample theta from 5--40 degrees, full phi, and a 50/50 uniform-p/uniform-1/p mixture from 0.7 GeV/c to beam momentum.
#
# Workflow:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-lund-creation/uniform-1e-4029MeV.conf --output OUTPUT_PARENT
#
# Units:
#   Beam energy and particle momenta are GeV and GeV/c; angles are degrees; vertices are cm.
#
# Notes:
#   This profile is complete except for output. A command-line --key value overrides the matching value below.

# Sample identity -------------------------------------------------------------
# `channel` selects one electron or an electron--hadron event; hadron fields identify the second particle and detector region.
# `beam-energy` sets the LUND beam field and the upper momentum scale for this beam-specific profile.

channel = 1e
beam-energy = 4.02962

# Target geometry and metadata ------------------------------------------------
# `target` plus beam energy resolves the GEMC variation, matching vertex geometry, and A/Z metadata.
# Every event samples one vertex position from that geometry and shares its coordinates between all particles in the event.

target = Ar40

# Run size and reproducibility ------------------------------------------------
# `events` is the total generated event count; `events-per-file` is the LUND split threshold.
# Kinematic and vertex-position seeds own separate ROOT random streams. Nonzero values make their sequences repeatable.

events = 50000000
events-per-file = 25000
seed = 67890
vertex-seed = 12345

# Output contract -------------------------------------------------------------
# LUND filenames are derived automatically from channel and beam energy. `--prefix` remains an explicit CLI override.
# The writer always uses the shared LUND text layout and external targets.h masses, and every uniform run writes ROOT/PDF/PNG monitoring artifacts.

# Electron kinematics ---------------------------------------------------------
# Theta is sampled uniformly inside the stated range and phi covers the full azimuth.
# `mixed` alternates uniform-p and uniform-1/p draws between the explicit momentum limits.

electron-theta-min = 5
electron-theta-max = 40
electron-p-min = 0.7
electron-p-max = 4.02962
