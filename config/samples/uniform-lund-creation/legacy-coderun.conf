# legacy-coderun.conf ----------------------------------------------------------
# Description: Explicit settings corresponding to the pinned upstream uniform CodeRun.cpp defaults.
#
# Purpose: Reproduce its active 2.07052 GeV 1e call, including 1-foil-small geometry and A=1/Z=1.
# 
# Usage:
#   source run.csh --workflow create-lund --source uniform \
#     --config config/samples/uniform-lund-creation/legacy-coderun.conf --output OUTPUT_PARENT
# 
# Main options:
#   channel, beam-energy, rgm-target, events, events-per-file, seed, and vertex-seed. Override the very large event count for smoke tests. CodeRun.cpp
#   also actively calls legacy ep and en; select them with `channel = eh`, `hadron = proton|neutron`,
#   `hadron-region = FD`, and an explicit matching prefix. Their compatibility settings are below. The upstream TRandom3(0) production state is unknown,
#   so this profile uses an explicit reproducible seed rather than claiming event replay.
#   This is a compatibility profile, not a physically consistent nuclear-metadata profile.

# Archived sample selection ---------------------------------------------------
# This profile selects the active legacy 2.07052 GeV 1e call. CLI channel/hadron overrides reproduce the active ep/en calls.

channel = 1e
beam-energy = 2.07052

# Legacy target semantics -----------------------------------------------------
# `C12-small` supplies 1-foil-small geometry and the C_S GEMC variation.
# A=1/Z=1 intentionally overrides catalog metadata because those values were written by the archived uniform generator.

rgm-target = C12-small
A = 1
Z = 1

# Archived run size and naming ------------------------------------------------
# Fifty million events reproduce 5000 legacy files times 10000 events. Override events for smoke tests.
# The maintained filename is derived from channel and beam; `--prefix` can reproduce an archived filename when needed.

events = 50000000
events-per-file = 10000

# Random streams --------------------------------------------------------------
# The nonzero seeds provide a repeatable comparison run. They cannot reconstruct an earlier TRandom3(0) sequence whose state was not recorded.

seed = 67890
vertex-seed = 12345

# Legacy-compatible kinematics ------------------------------------------------
# The 1e electron is uniform from zero to beam momentum. ep/en overrides use uniform hadron momentum from 0.3 GeV/c.
# Flat theta and phi retain the archived angular prescription; the sampled hadron maximum is always the configured beam momentum.

electron-momentum = uniform
electron-p-min = 0
electron-p-max = auto
hadron-momentum = uniform
hadron-p-min = 0.3

# Maintained serialization ----------------------------------------------------
# Output always uses the project LUND layout and external targets.h masses.
