# Submission inputs -----------------------------------------------------------
# Purpose:
#   example overrides for existing LUND input, not a site registry.
# 
#
# Workflow:
#   source run.csh --workflow submit --config config/submission.conf
#   Preview is the default. Pass --execute on the CLI to submit; config cannot enable execution.
#   Replace lund-dir with the actual shared-storage directory; other paths are relative to this file.
#   With a completed manifest, sample metadata, file count and event limit are automatic.
lund-dir = /shared/Uniform_sample_enFD_2070MeV/lundfiles

# Optional simulation overrides; GEMC falls back to 5.14 without a usable manifest version.
# gemc-version = 5.14
# gcard = detector/Generation_files_2GeV/5.14/rgm_fall2021_Ar_2GeV.gcard
# yaml = detector/Generation_files_2GeV/5.14/rgm_fall2021-cv.yaml
# torus = 0.5
# num-jobs = 10
# events-per-job = 25000
# Use a custom fork of https://github.com/gemc/clas12Tags for detector-development tests.
# When set, clas12tags-dir replaces the preloaded ifarm GEMC_DATA_DIR.
# clas12tags-dir = /shared/USERNAME/clas12Tags
# clear-farm-out = false
# farm-out = /farm_out/USERNAME

# Required manual metadata when no manifest exists. Uncomment and adapt these together.
# source = uniform
# beam-energy = 2.07052
# rgm-target = Ar40
# channel = eh
# hadron = neutron
# hadron-region = FD
# prefix = Uniform_sample_enFD_2070MeV
# gemc-target-variation = rgm_fall2021_Ar
# events-per-job = 25000
# Physical input instead uses source=physical, event-generator, tune and q2-cut; omit channel/hadron.
